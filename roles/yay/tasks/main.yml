---

- name: Ensure build dependencies
  become: true
  pacman:
    name:
      - base-devel
      - curl
      - git

- name: Optimize makepkg compression
  become: true
  lineinfile:
    dest: /etc/makepkg.conf
    line: "COMPRESSXZ=(xz --threads=$(nproc) -v -c -z -9 -)"
    regexp: "^COMPRESSXZ="

- name: Check yay installed
  command: pacman -Q yay
  failed_when: false
  changed_when: yay.rc != -0
  register: yay

- name: Create yay build directory
  file:
    dest: /tmp/yay
    state: directory
  when: yay.rc != 0

- name: Download yay
  get_url:
    url: https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=yay
    dest: /tmp/yay/PKGBUILD
  when: yay.rc != 0

- name: Install yay
  shell: makepkg -i PKGBUILD --noconfirm
  args:
    chdir: /tmp/yay
  when: yay.rc != 0
  notify: Cleanup yay build directory

- name: Ensure aurbuiler user exists
  when: yay_aur_builder_enable
  become: true
  user:
    state: present
    name: "{{yay_aur_builder_username }}"
    system: true
    shell: /usr/bin/nologin
    create_home: false

- name: Ensure AUR builder user can execute commands without sudo
  when: yay_aur_builder_enable
  become: true
  lineinfile:
    path: /etc/sudoers.d/aur_builder-allow-pacman
    state: present
    line: "{{ yay_aur_builder_username}} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    validate: /usr/sbin/visudo -cf %s
    create: yes
